      ${res.map(r => r.error ? `<tr><td>${esc(r.file)} ${esc(r.sheet || "")}</td><td colspan="8" class="bad">${esc(r.error)}</td></tr>` : (x => `<tr>
        <td>${esc(r.file)}<br><small>${esc(x.sheet)}</small></td><td>${esc(x.company)}</td><td>${fmtDate(x.as_of)}</td>
        <td class="${x.status === "error" ? "bad" : x.status === "skipped" ? "skip" : "ok"}">${esc(x.status)}${x.message ? "<br><small>" + esc(x.message) + "</small>" : ""}</td>
        <td class="num">${x.customers}</td><td class="num">${x.added}</td><td class="num">${x.archived}</td><td class="num">${x.reactivated}</td><td class="num">${money(x.total)}</td></tr>`)(r.result)).join("")}</table>`;
    $("#importResult").style.display = "flex";
    await loadCompanies(); if (S.page === "grid") loadGrid();
  } catch (err) { toast("Import failed: " + err.message); }
  finally { $("#btnImport").disabled = false; $("#btnImport").textContent = "⬆ Import AR report(s)"; e.target.value = ""; }
};

$("#btnHistory").onclick = () => $("#hfile").click();
$("#hfile").onchange = async e => {
  const files = [...e.target.files]; if (!files.length) return;
  const fd = new FormData(); files.forEach(f => fd.append("file", f, f.name));
  const b = $("#btnHistory"); b.disabled = true; b.textContent = "Importing…";
  try {
    const res = await api("/api/import-history", {method: "POST", body: fd});
    $("#irBody").innerHTML = `<p style="color:var(--muted)">Nothing already in the app is overwritten or duplicated, so this is safe to re-run. Import the latest AR report first, so customers who aren't on it go to the archive.</p>` +
      res.map(r => r.error ? `<p class="bad"><b>${esc(r.file)}</b>: ${esc(r.error)}</p>` : (x => `
      <h4>${esc(r.file)} → ${esc(x.company)} (as of ${fmtDate(x.as_of)})</h4>
      <table><tr><td>Sheets read</td><td>${esc(x.sheets.join(", "))}</td></tr>
        <tr><td>Customers matched</td><td>${x.customers_matched}</td></tr>
        <tr><td>Not on any report → added to archive</td><td>${x.customers_created_archived}</td></tr>
        <tr><td>Activity entries imported</td><td class="ok">${x.notes_imported}</td></tr>
        <tr><td>Already in the activity log (skipped)</td><td>${x.notes_kept_existing}</td></tr>
        <tr><td>Attribute values set</td><td>${x.attrs_set}</td></tr>
        <tr><td>Statuses set from cell colour</td><td>${x.statuses_set}</td></tr>
        ${x.new_attributes.length ? `<tr><td>New global attributes created</td><td>${esc(x.new_attributes.join(", "))}</td></tr>` : ""}
        ${x.warnings.map(w => `<tr><td colspan="2" class="bad">${esc(w)}</td></tr>`).join("")}</table>
      <details><summary>Notes columns → week (${x.note_columns.length})</summary><table>${x.note_columns.map(([h, w]) => `<tr><td>${esc(h.slice(0, 90))}</td><td>${esc(w)}</td></tr>`).join("")}</table></details>`)(r.result)).join("");
    $("#importResult").style.display = "flex";
    await loadCompanies(); if (S.page === "grid") loadGrid();
  } catch (err) { toast("Import failed: " + err.message); }
  finally { b.disabled = false; b.textContent = "⬆ Import notes history"; e.target.value = ""; }
};

$("#btnReceipts").onclick = () => $("#rfile").click();
$("#rfile").onchange = async e => {
  const files = [...e.target.files]; if (!files.length) return;
  const fd = new FormData(); files.forEach(f => fd.append("file", f, f.name));
  const b = $("#btnReceipts"); b.disabled = true; b.textContent = "Importing…";
  try {
    const res = await api("/api/import-receipts", {method: "POST", body: fd});
    $("#irBody").innerHTML = `<p style="color:var(--muted)">Each customer's most recent payment day is used, with same-day receipts totalled. A newer payment date already in the app is never replaced.</p>` +
      res.map(r => r.error ? `<p class="bad"><b>${esc(r.file)}</b>: ${esc(r.error)}</p>` : (x => `
      <h4>${esc(r.file)}</h4>
      <table><tr><td>Receipts read</td><td>${x.receipts.toLocaleString()} · ${fmtDate(x.first_date)} – ${fmtDate(x.last_date)} · ${money0(x.total)}</td></tr>
        <tr><td>Customers in the file</td><td>${x.customers_in_file}</td></tr>
        <tr><td>Matched to open accounts</td><td>${x.matched_open}</td></tr>
        <tr><td>Matched to paid-off / archived accounts</td><td>${x.matched_archived}</td></tr>
        <tr><td>Last payment updated</td><td class="ok"><b>${x.updated}</b></td></tr>
        <tr><td>Already up to date</td><td>${x.already_current}</td></tr>
        <tr><td>Kept a newer date already in the app</td><td>${x.kept_newer}</td></tr>
        <tr><td>Not in the app (no AR balance on record) – ignored</td><td class="skip">${x.not_in_app}</td></tr>
        ${x.ambiguous.length ? `<tr><td class="bad">Customer ID found in more than one company – skipped</td><td class="bad">${esc(x.ambiguous.join(", "))}</td></tr>` : ""}</table>
      ${x.examples.length ? `<details><summary>Examples of same-day payments totalled</summary><table>${x.examples.map(([n, d, a, k]) => `<tr><td>${esc(n)}</td><td>${fmtDate(d)}</td><td class="num">${money(a)}</td><td>${k} receipts</td></tr>`).join("")}</table></details>` : ""}`)(r.result)).join("");
    $("#importResult").style.display = "flex";
    if (S.page === "grid" && S.data) loadGrid();
  } catch (err) { toast("Import failed: " + err.message); }
  finally { b.disabled = false; b.textContent = "⬆ Import receipts"; e.target.value = ""; }
};

// ---------- users & company access ----------
$("#btnUsers").onclick = () => { S.page = "users"; renderNav(); renderUsers(); };
async function renderUsers() {
  const d = await api("/api/users");
  const isAdmin = u => (u.roles || "").split(",").includes("ar_admin");
  const status = u => isAdmin(u) ? `<span class="tag" style="background:var(--accent-soft);color:var(--accent)">admin – all companies</span>`
    : !u.company_ids.length ? `<span class="tag" style="background:#fde2e1;color:var(--danger)">no access</span>`
    : `<span class="tag">${u.company_ids.length} compan${u.company_ids.length > 1 ? "ies" : "y"}</span>` + (u.settings_company_ids.length ? `<br><span class="tag" style="background:#fff4d6;color:#8a5a00">⚙ settings manager: ${u.settings_company_ids.length}</span>` : "");
  $("#main").innerHTML = `<div class="toolbar"><h2>Users &amp; company access</h2></div><div class="page">
  <div class="card"><h3>Who can see which companies</h3>
    <p style="color:var(--muted);margin-top:0">Staff see only the companies ticked here; with none ticked they see nothing. AR admins always see every company and its settings.
      Tick <b>⚙</b> under a company to also let that person open its <b>Company settings</b> (for example a manager who maintains the account owner list). Only AR admins can grant this. Set each collector's <b>full name</b> exactly as it appears on the account owner list, so their accounts show on their <b>★ My work</b> page.
      People appear here automatically the first time they sign in. You can also add someone ahead of time by their sign-in name.</p>
    <p><input id="nuName" placeholder="Sign-in user name" style="width:220px"> <input id="nuEmail" placeholder="Email (optional)" style="width:220px"> <button class="primary" id="nuAdd">Add user</button></p>
    ${d.users.length ? `<div style="overflow:auto"><table class="matrix"><tr><th>User</th><th>Access</th>${d.companies.map(c => `<th class="rot" title="${esc(c.name)}">${esc(c.code)} · ${esc(c.name)}</th>`).join("")}<th></th></tr>
    ${d.users.map(u => `<tr data-user="${esc(u.username)}">
      <td><b>${esc(u.username)}</b><br><input data-un value="${esc(u.display_name || "")}" placeholder="Full name (account owner)" title="Must match the name on the company's account owner list. Links this sign-in to their accounts on My work." style="width:180px;font-size:12px;margin:2px 0">${u.email ? `<br><small style="color:var(--muted)">${esc(u.email)}</small>` : ""}<br><small style="color:var(--muted)">${u.last_seen ? "last sign-in " + fmtTs(u.last_seen) : "hasn't signed in yet"}</small></td>
      <td>${status(u)}</td>
      ${d.companies.map(c => `<td style="white-space:nowrap"><input type="checkbox" data-uc="${c.id}" ${u.company_ids.includes(c.id) ? "checked" : ""} ${isAdmin(u) ? "disabled title='Admins see every company'" : "title='Can see this company'"}><label title="Can open this company's Company settings" style="font-size:11px;margin-left:2px;${isAdmin(u) || !u.company_ids.includes(c.id) ? "opacity:.35" : ""}"><input type="checkbox" data-us="${c.id}" ${u.settings_company_ids.includes(c.id) ? "checked" : ""} ${isAdmin(u) || !u.company_ids.includes(c.id) ? "disabled" : ""}>⚙</label></td>`).join("")}
      <td style="white-space:nowrap">${isAdmin(u) ? "" : `<button data-ua="1">All</button> <button data-ua="0">None</button> `}${u.username === d.me ? "" : `<button data-urm>Remove</button>`}</td>
    </tr>`).join("")}</table></div>` : `<p>No users yet.</p>`}
  </div>
  <div class="card"><h3>Access changes</h3>
    ${d.log.length ? `<table><tr><th>When</th><th>By</th><th>User</th><th>Change</th></tr>${d.log.map(l => `<tr><td>${fmtTs(l.at)}</td><td>${esc(l.actor)}</td><td>${esc(l.username)}</td><td>${esc(l.change)}</td></tr>`).join("")}</table>` : `<p style="color:var(--muted)">No changes yet.</p>`}
  </div></div>`;
  const save = async tr => {
    const ids = [...tr.querySelectorAll("[data-uc]")].filter(x => x.checked).map(x => +x.dataset.uc);
    const mgr = [...tr.querySelectorAll("[data-us]")].filter(x => x.checked && ids.includes(+x.dataset.us)).map(x => +x.dataset.us);
    try { await put(`/api/users/${encodeURIComponent(tr.dataset.user)}/companies`, {company_ids: ids, settings_company_ids: mgr}); toast("Access updated for " + tr.dataset.user); renderUsers(); }
    catch (e) { toast(e.message); renderUsers(); }
  };
  document.querySelectorAll("[data-uc]").forEach(el => el.onchange = () => save(el.closest("tr")));
  document.querySelectorAll("[data-us]").forEach(el => el.onchange = () => save(el.closest("tr")));
  document.querySelectorAll("[data-un]").forEach(el => el.onchange = async () => {
    const u = el.closest("tr").dataset.user;
    try { await flash(el, put(`/api/users/${encodeURIComponent(u)}/name`, {display_name: el.value})); toast(`Full name saved for ${u}`); } catch {}
  });
  document.querySelectorAll("[data-ua]").forEach(el => el.onclick = () => { const tr = el.closest("tr"); tr.querySelectorAll("[data-uc]").forEach(x => x.checked = el.dataset.ua === "1"); if (el.dataset.ua === "0") tr.querySelectorAll("[data-us]").forEach(x => x.checked = false); save(tr); });
  document.querySelectorAll("[data-urm]").forEach(el => el.onclick = async () => {
    const u = el.closest("tr").dataset.user;
    if (!confirm(`Remove ${u} and all of their company access?`)) return;
    await api(`/api/users/${encodeURIComponent(u)}`, {method: "DELETE"}); toast(`Removed ${u}`); renderUsers();
  });
  $("#nuAdd").onclick = async () => {
    const username = $("#nuName").value.trim(); if (!username) return $("#nuName").focus();
    try { await api("/api/users", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({username, email: $("#nuEmail").value})}); toast("Added " + username); renderUsers(); }
    catch (e) { toast(e.message); }
  };
}

// ---------- settings ----------
$("#btnSettings").onclick = () => { S.page = "settings"; renderNav(); renderSettings(); };
const KINDS = ["text", "longtext", "date", "number", "money", "select"];
async function renderSettings() {
  const s = await api("/api/settings");
  const on = new Set(s.enabled.map(e => e.company_id + ":" + e.attribute_id));
  const active = s.attributes.filter(a => !a.archived);
  $("#main").innerHTML = `<div class="toolbar"><h2>Global attributes &amp; company settings</h2></div><div class="page">
  <div class="card"><h3>Which attributes each company uses</h3>
    ${s.companies.length ? `<table class="matrix"><tr><th>Attribute</th>${s.companies.map(c => `<th class="rot">${esc(c.code)} · ${esc(c.name)}</th>`).join("")}<th>All</th></tr>
    ${active.map(a => `<tr><td>${esc(a.name)}</td>${s.companies.map(c => `<td><input type="checkbox" data-m="${c.id}:${a.id}" ${on.has(c.id + ":" + a.id) ? "checked" : ""}></td>`).join("")}
      <td><button data-all="${a.id}" data-v="1">on</button> <button data-all="${a.id}" data-v="0">off</button></td></tr>`).join("")}</table>` : "<p>No companies yet — they are created automatically on import.</p>"}
  </div>
  <div class="card"><h3>Master attribute list</h3>
    <table><tr><th>Name</th><th>Type</th><th>Choices (for “select”)</th><th>On for new companies</th><th>Retired</th><th></th></tr>
    ${s.attributes.map(a => attrRow(a)).join("")}
    ${attrRow({id: "new", name: "", kind: "text", options: "[]", default_on: 0, archived: 0})}
    </table>
    <p style="color:var(--muted)">Retiring an attribute hides it everywhere but keeps its saved values. “Select” choices can each have a highlight colour; the attribute named <b>Status</b> colours the customer name.</p>
  </div></div>`;
  document.querySelectorAll("[data-m]").forEach(el => el.onchange = async () => { const [c, a] = el.dataset.m.split(":"); await flash(el, put(`/api/companies/${c}/attributes/${a}`, {enabled: el.checked})); });
  document.querySelectorAll("[data-all]").forEach(el => el.onclick = async () => { await put(`/api/attributes/${el.dataset.all}/all`, {enabled: el.dataset.v === "1"}); renderSettings(); });
  document.querySelectorAll("tr[data-attr]").forEach(tr => {
    const kindSel = tr.querySelector("[name=kind]"), optBox = tr.querySelector(".opts");
    const sync = () => optBox.style.display = kindSel.value === "select" ? "" : "none"; sync(); kindSel.onchange = sync;
    tr.querySelector(".addopt").onclick = () => optBox.insertAdjacentHTML("beforeend", optRow({label: "", color: "#ffeb9c"}));
    optBox.onclick = e => { if (e.target.classList.contains("delopt")) e.target.parentElement.remove(); };
    tr.querySelector(".save").onclick = async () => {
      const id = tr.dataset.attr;
      const body = { name: tr.querySelector("[name=name]").value, kind: kindSel.value,
        options: [...optBox.querySelectorAll(".opt")].map(o => ({label: o.querySelector("[type=text]").value.trim(), color: o.querySelector("[type=color]").value})).filter(o => o.label),
        default_on: tr.querySelector("[name=def]").checked, archived: tr.querySelector("[name=arch]").checked };
      try { id === "new" ? await api("/api/attributes", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)}) : await put(`/api/attributes/${id}`, body); toast("Saved"); renderSettings(); }
      catch (e) { toast(e.message); }
    };
  });
}
const optRow = o => `<div class="opt"><input type="text" value="${esc(o.label)}" placeholder="Choice"><input type="color" value="${esc(o.color || "#ffffff")}"><button class="delopt" title="Remove">✕</button></div>`;
function attrRow(a) {
  const opts = JSON.parse(a.options || "[]");
  return `<tr data-attr="${a.id}" style="${a.archived ? "opacity:.55" : ""}">
    <td><input name="name" value="${esc(a.name)}" placeholder="${a.id === "new" ? "New attribute name…" : ""}" style="width:220px"></td>
    <td><select name="kind">${KINDS.map(k => `<option ${k === a.kind ? "selected" : ""}>${k}</option>`).join("")}</select></td>
    <td><div class="opts">${opts.map(optRow).join("")}</div><button class="addopt" style="font-size:11px">+ choice</button></td>
    <td style="text-align:center"><input type="checkbox" name="def" ${a.default_on ? "checked" : ""}></td>
    <td style="text-align:center"><input type="checkbox" name="arch" ${a.archived ? "checked" : ""}></td>
    <td><button class="save ${a.id === "new" ? "primary" : ""}">${a.id === "new" ? "Add" : "Save"}</button></td></tr>`;
}

// ---------- sign-in ----------
async function showSignIn(msg = "") {
  const h = await fetch("/health").then(r => r.json()).catch(() => ({}));
  $("#signin").style.display = "flex";
  $("#siBody").innerHTML = (msg ? `<p class="bad">${esc(msg)}</p>` : "") + (h.dev_sign_in ? `
    <p style="color:var(--muted)">Test sign-in for local development. In production this is replaced by your identity provider.</p>
    <p><label>User name<br><input id="siUser" value="${esc(store.get("devUser", ""))}" placeholder="e.g. jwest" style="width:100%"></label></p>
    <p><label>Role<br><select id="siRole" style="width:100%"><option value="ar_staff">AR staff – view accounts and log activity</option><option value="ar_admin">AR admin – also imports reports and manages settings</option></select></label></p>
    <p><button class="primary" id="siGo">Sign in</button></p>`
    : `<p>Production sign-in is not configured on this server yet.</p>`);
  if (!h.dev_sign_in) return;
  if (store.get("devRole", "")) $("#siRole").value = store.get("devRole", "");
  const go = async () => {
    const u = $("#siUser").value.trim(); if (!u) return $("#siUser").focus();
    try {
      const r = await api("/auth/dev-login", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({user: u, roles: [$("#siRole").value]})});
      store.set("devUser", u); store.set("devRole", $("#siRole").value);
      token.set(r.token); $("#signin").style.display = "none"; start();
    } catch (e) { toast(e.message); }
  };
  $("#siGo").onclick = go; $("#siUser").onkeydown = e => { if (e.key === "Enter") go(); };
  $("#siUser").focus();
}
$("#btnOut").onclick = () => { token.set(null); S.me = null; closeDrawer(); $("#main").innerHTML = ""; $("#nav").innerHTML = ""; showSignIn(); };

async function start() {
  if (!token.get()) return showSignIn();
  try { S.me = await api("/api/me"); } catch { return; }
  if (!S.me.staff) { token.set(null); return showSignIn(`${S.me.principal.user} does not have access to AR Tracker.`); }
  $("#who").textContent = `${S.me.principal.user} · ${S.me.admin ? "AR admin" : "AR staff"}`;
  ["#btnImport", "#btnHistory", "#btnReceipts", "#btnSettings", "#btnUsers"].forEach(s => $(s).style.display = S.me.admin ? "" : "none");
  await loadCompanies();
  if (!S.me.admin && !S.companies.length) {
    $("#main").innerHTML = `<div class="page"><div class="card"><h3>No companies assigned yet</h3>
      <p>You're signed in as <b>${esc(S.me.principal.user)}</b>, but an AR admin hasn't given you access to any companies.</p>
      <p style="color:var(--muted)">Ask an AR admin to open <b>Users &amp; access</b> and tick the companies you work on. Then refresh this page.</p></div></div>`;
    return;
  }
  // People linked to an account owner name land on their own work list.
  if (S.me.display_name) { S.page = "mywork"; renderNav(); return loadMyWork(); }
  if (S.companyId) loadGrid();
}
start().catch(e => toast(e.message));
</script>
</body>
